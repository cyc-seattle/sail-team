[tools]
node = "22"
pnpm = "10"
lefthook = "2"
pulumi = "3.272.0"
# For the GKE auth plugin Pulumi's Kubernetes provider runs. Needs a system Python on macOS.
gcloud = "latest"

[env]
# Actions' auth step sets this, so keep it when set. Otherwise it's the main checkout's .gcloud/, even
# from a worktree, so every worktree shares one login.
GOOGLE_APPLICATION_CREDENTIALS = "{{ get_env(name='GOOGLE_APPLICATION_CREDENTIALS', default=exec(command='dirname \"$(git rev-parse --path-format=absolute --git-common-dir)\"') ~ '/.gcloud/application_default_credentials.json') }}"
GCP_PROJECT = "cyc-admin-scripts"
CLOUDSDK_CORE_PROJECT = "{{ env.GCP_PROJECT }}"
PULUMI_STACK = "{{ get_env(name='PULUMI_STACK', default='prod') }}"
# Each stack's state lives in its own environment's bucket, from platform's bootstrap stack.
PULUMI_BACKEND_URL = "gs://{{ env.GCP_PROJECT }}-pulumi-{{ env.PULUMI_STACK }}"

[tasks.install]
description = "Install dependencies, git hooks, the Chromium the story tests run in, and the GKE auth plugin"
run = [
  "pnpm install",
  "lefthook install",
  "pnpm exec playwright install ${CI:+--with-deps} chromium",
  "gcloud components install gke-gcloud-auth-plugin --quiet",
]

[tasks.dev]
description = "Serve the app locally with Vite"
run = "pnpm exec vite"

[tasks.storybook]
description = "Serve Storybook, the catalog of every component, locally"
run = "pnpm exec storybook dev -p 6006"

# Published to GitHub Pages by storybook.yml. Its paths are relative, so it works under /sail-team/.
[tasks.build-storybook]
description = "Build Storybook into storybook-static/"
run = "pnpm exec storybook build"

[tasks.build]
description = "Build the app into dist/"
run = "pnpm exec vite build"

[tasks.format]
description = "Format and fix all files"
run = ["pnpm exec prettier --write .", "pnpm exec eslint --fix ."]

# The build writes src/routeTree.gen.ts, which the typecheck reads.
[tasks.check]
description = "Build, typecheck, then check formatting and lint"
depends = ["build"]
run = ["pnpm exec tsc -p tsconfig.json", "pnpm exec prettier --check .", "pnpm exec eslint ."]

[tasks.test]
description = "Run unit tests"
run = "pnpm exec vitest run"

# The org's deploy.yml calls preview and deploy with PULUMI_STACK set. Locally, set it: it defaults to prod.
[tasks.preview]
description = "Show the diff `mise run deploy` would apply to $PULUMI_STACK"
run = "./scripts/stack preview"

[tasks.deploy]
description = "Apply $PULUMI_STACK"
run = "./scripts/stack up --yes"

# Needs the dev deploy, so it isn't part of ci.
[tasks.integration]
description = "Run the sign-in journeys in a browser against dev"
run = ["pnpm exec bddgen", "pnpm exec playwright test --pass-with-no-tests"]

[tasks.ci]
description = "Run all checks and tests"
depends = ["check", "test"]
