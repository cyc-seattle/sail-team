name: pull-request

# A PR runs only CI. Main's push deploys dev, starts the journeys there in integration.yml, then
# previews prod and deploys it once a maintainer approves (cyc-seattle/platform#280).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Retries main's deploys.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'pull_request'
    uses: cyc-seattle/.github/.github/workflows/ci.yml@v4.0.0
  dev:
    if: github.ref == 'refs/heads/main'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v4.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      task: deploy
  # A run started with GITHUB_TOKEN may start only a workflow_dispatch, so the tests run in a
  # workflow of their own, which keeps them out of this run.
  integration:
    needs: dev
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run integration.yml -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
  # Runs merged code with prod credentials before anyone approves, which is safe only because main requires a PR.
  prod-preview:
    needs: dev
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v4.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod-preview
      task: preview
  # Skipped when the preview shows no changes, so a no-op deploy never asks for approval.
  prod:
    needs: prod-preview
    if: needs.prod-preview.outputs.changes == 'true'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v4.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      task: deploy
