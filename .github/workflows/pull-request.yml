name: pull-request

# A PR runs CI, and integration-ci.yml runs the journeys, so a PR merges only once both pass. Main's push
# previews prod and deploys it once a maintainer approves (cyc-seattle/platform#171).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Retries main's deploy.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'pull_request'
    uses: cyc-seattle/.github/.github/workflows/ci.yml@v5.0.0
  # Runs merged code with prod credentials before anyone approves, which is safe only because main requires a PR.
  prod-preview:
    if: github.ref == 'refs/heads/main'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v5.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod-preview
      task: preview
  # Skipped when the preview shows no changes, so a no-op deploy never asks for approval.
  prod:
    needs: prod-preview
    if: needs.prod-preview.outputs.changes == 'true'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v5.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      task: deploy
